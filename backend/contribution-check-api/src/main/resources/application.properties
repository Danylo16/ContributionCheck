spring.application.name=contribution-check-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/contribution_check}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:contribution_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:contribution_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}